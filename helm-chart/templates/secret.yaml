apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shopnow-order-management.fullname" . }}-secret
type: Opaque
stringData:
  SHOPNOW_DB_USERNAME: {{ .Values.secrets.databaseUsername | quote }}
  SHOPNOW_DB_PASSWORD: {{ .Values.secrets.databasePassword | quote }}
  SHOPNOW_APP_USERNAME: {{ .Values.secrets.appUsername | quote }}
  SHOPNOW_APP_PASSWORD: {{ .Values.secrets.appPassword | quote }}
  SHOPNOW_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
