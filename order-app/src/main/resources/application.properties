spring.application.name=shopnow-order-management
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SHOPNOW_DB_URL:jdbc:mysql://localhost:3306/SHOPNOW_ORDER_MANAGEMENT?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SHOPNOW_DB_USERNAME:root}
spring.datasource.password=${SHOPNOW_DB_PASSWORD:vision@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

integration.shipping-carrier.url=${SHIPPING_CARRIER_URL:http://localhost:9091}
integration.payment-gateway.url=${PAYMENT_GATEWAY_URL:http://localhost:9092}

logging.config=classpath:log4j2.xml

app.security.default-user.username=${SHOPNOW_APP_USERNAME:shopnow-admin}
app.security.default-user.password=${SHOPNOW_APP_PASSWORD:shopnow123}
app.security.jwt.secret=${SHOPNOW_JWT_SECRET:U2hvcE5vd0p3dFNlY3JldEtleUZvckxvY2FsRGV2RW52aXJvbm1lbnQxMjM0NTY3ODkw}
app.security.jwt.expiration-seconds=${SHOPNOW_JWT_EXPIRATION_SECONDS:86400}
